name: "Setup Stripe (crear payment links)"
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/setup-stripe.mjs
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      - name: Guardar links en store.config.json
        run: |
          git config user.name "lisso-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store.config.json
          git diff --cached --quiet || (git commit -m "chore: actualizar payment links de Stripe" && git pull --rebase && git push)
  deploy:
    needs: setup
    uses: ./.github/workflows/deploy.yml
