name: "Stock y costes CJ (cada 6 h)"
on:
  schedule:
    - cron: '5 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
jobs:
  stock:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/stock.mjs
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          OPS_EMAIL: ${{ vars.OPS_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: commit
        run: |
          git config user.name "lisso-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/stock.json
          if git diff --cached --quiet; then echo "changed=false" >> $GITHUB_OUTPUT; else
            git commit -m "chore: actualizar stock" && git pull --rebase && git push && echo "changed=true" >> $GITHUB_OUTPUT; fi
  deploy:
    needs: stock
    if: needs.stock.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
