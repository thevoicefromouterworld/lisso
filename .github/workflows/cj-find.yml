name: "Buscar producto en CJ"
on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Palabras clave (inglés) o "--pid <PID>" para ver variantes'
        default: 'lint remover electric rechargeable'
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Buscar
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          QUERY: ${{ inputs.query }}
        run: |
          mkdir -p ops
          if [[ "$QUERY" == --pid* ]]; then node scripts/cj-find.mjs --pid "${QUERY#--pid }" | tee ops/cj-producto.md; else node scripts/cj-find.mjs "$QUERY" | tee ops/cj-busqueda.md; fi
      - name: Guardar resultado en ops/
        run: |
          git config user.name "lisso-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/ && (git diff --cached --quiet || (git commit -m "ops: resultado búsqueda CJ" && git pull --rebase && git push))
