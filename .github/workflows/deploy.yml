name: Deploy web (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['site/**', 'store.config.json', 'scripts/**', 'tests/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests de las automatizaciones
        run: node --test tests/*.test.mjs
      - name: Build
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
